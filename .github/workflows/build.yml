name: Sestavit TizenTube pro Moje TV v3
on:
  push:
    branches: [main]
    paths:
      - package.json
      - home-shortcut.js
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stahnout oficialni TizenTube 1.15.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tizen-upstream"
          ARCHIVE=$(npm pack '@foxreis/tizentube@1.15.2' --silent --pack-destination "$RUNNER_TEMP/tizen-upstream")
          tar -xzf "$RUNNER_TEMP/tizen-upstream/$ARCHIVE" -C "$RUNNER_TEMP/tizen-upstream"
          test -s "$RUNNER_TEMP/tizen-upstream/package/dist/userScript.js"
          test -s "$RUNNER_TEMP/tizen-upstream/package/dist/service.js"
          mkdir -p dist
          cp "$RUNNER_TEMP/tizen-upstream/package/dist/userScript.js" dist/userScript-moje-tv-v3.js
          cp "$RUNNER_TEMP/tizen-upstream/package/dist/service.js" dist/service.js
          if test -f "$RUNNER_TEMP/tizen-upstream/package/LICENSE"; then cp "$RUNNER_TEMP/tizen-upstream/package/LICENSE" LICENSE; fi
          printf '\n;\n' >> dist/userScript-moje-tv-v3.js
          cat home-shortcut.js >> dist/userScript-moje-tv-v3.js
      - name: Overit syntaxi
        run: |
          node --check dist/userScript-moje-tv-v3.js
          node --check dist/service.js
      - name: Ulozit v3 do repozitare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/ LICENSE 2>/dev/null || git add dist/
          if ! git diff --cached --quiet; then git commit -m 'Build v3 [skip ci]' && git push; fi
      - name: Pročistit jsDelivr CDN cache pro nový modul
        shell: bash
        run: |
          curl -fsS 'https://purge.jsdelivr.net/gh/romangazdik-web/TizenTube-MojeTV@main/package.json' || true
          curl -fsS 'https://purge.jsdelivr.net/gh/romangazdik-web/TizenTube-MojeTV@main/dist/userScript-moje-tv-v3.js' || true
