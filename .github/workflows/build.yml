name: Sestavit TizenTube pro Moje TV v4
on:
  push:
    branches: [main]
    paths:
      - package.json
      - home-shortcut.js
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stahnout oficialni TizenTube 1.15.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tizen-upstream"
          ARCHIVE=$(npm pack '@foxreis/tizentube@1.15.2' --silent --pack-destination "$RUNNER_TEMP/tizen-upstream")
          tar -xzf "$RUNNER_TEMP/tizen-upstream/$ARCHIVE" -C "$RUNNER_TEMP/tizen-upstream"
          test -s "$RUNNER_TEMP/tizen-upstream/package/dist/userScript.js"
          test -s "$RUNNER_TEMP/tizen-upstream/package/dist/service.js"
          mkdir -p dist
          cp "$RUNNER_TEMP/tizen-upstream/package/dist/service.js" dist/service.js
          if test -f "$RUNNER_TEMP/tizen-upstream/package/LICENSE"; then cp "$RUNNER_TEMP/tizen-upstream/package/LICENSE" LICENSE; fi
          # Resolve conflicts in the ACTUAL upstream code, not just our listener.
          # Original: 403=Theme Configuration, 404=PiP/special menu.
          # On Nymind: RED=Home, GREEN=App Switcher.
          SRC="$RUNNER_TEMP/tizen-upstream/package/dist/userScript.js" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['SRC'])
          src=p.read_text()
          for old,new in [('403==e.keyCode','-903===e.keyCode'),('404==e.keyCode','-904===e.keyCode')]:
              hits=src.count(old)
              if hits!=1: raise SystemExit(f'Expected exactly one {old}, found {hits}')
              src=src.replace(old,new)
          p.write_text(src)
          PY
          { cat home-shortcut.js; printf '\n;\n'; cat "$RUNNER_TEMP/tizen-upstream/package/dist/userScript.js"; } > dist/userScript-moje-tv-v4.js
          grep -q 'NymindNavigation' dist/userScript-moje-tv-v4.js
          if grep -q '403==e.keyCode' dist/userScript-moje-tv-v4.js; then echo 'Original theme shortcut still present'; exit 1; fi
          if grep -q '404==e.keyCode' dist/userScript-moje-tv-v4.js; then echo 'Original green shortcut still present'; exit 1; fi
      - name: Overit syntaxi
        run: |
          node --check dist/userScript-moje-tv-v4.js
          node --check dist/service.js
      - name: Ulozit v4 do repozitare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/ LICENSE 2>/dev/null || git add dist/
          if ! git diff --cached --quiet; then git commit -m 'Build v4 [skip ci]' && git push; fi
      - name: Publish Nymind TizenTube version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git fetch origin main --tags
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" HEAD -m "TizenTube Nymind ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi
      - name: Procistit jsDelivr CDN cache
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for REV in "" "@main" "@latest" "@v${VERSION}"; do
            curl -fsS "https://purge.jsdelivr.net/gh/romangazdik-web/TizenTube-MojeTV${REV}/package.json" || true
            curl -fsS "https://purge.jsdelivr.net/gh/romangazdik-web/TizenTube-MojeTV${REV}/dist/userScript-moje-tv-v4.js" || true
          done

